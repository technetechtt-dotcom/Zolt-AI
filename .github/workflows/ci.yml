name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zolt
          POSTGRES_PASSWORD: zolt
          POSTGRES_DB: zolt
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://zolt:zolt@localhost:5432/zolt
      REDIS_URL: redis://localhost:6379
      ZOLT_ADVISORY_ONLY: "true"
      ZOLT_ALLOW_INSECURE_AUTH: "true"
      PRISMA_GENERATE_SKIP_AUTOINSTALL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm scan:secrets
      - run: pnpm sbom
      - name: Block critical npm vulnerabilities
        run: pnpm audit --prod --audit-level critical

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Block critical filesystem vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  high-severity-release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Block high and critical npm vulnerabilities for releases
        run: pnpm audit --prod --audit-level high
      - name: Block high and critical filesystem vulnerabilities for releases
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  evidence-release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm evidence:verify

  integration:
    runs-on: ubuntu-latest
    needs: [unit, security]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zolt
          POSTGRES_PASSWORD: zolt
          POSTGRES_DB: zolt
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://zolt:zolt@localhost:5432/zolt
      REDIS_URL: redis://localhost:6379
      ZOLT_ADVISORY_ONLY: "true"
      ZOLT_API_KEY: ci-api-key
      ZOLT_INGEST_HMAC_SECRET: ci-hmac-secret
      ZOLT_MASTER_KEY: ci-master-key-not-for-production
      ZOLT_AUTO_PROVISION_IDENTITIES: "false"
      ZOLT_BOOTSTRAP_TENANT_ID: tenant-smoke
      ZOLT_BOOTSTRAP_PRODUCT_ID: product-smoke
      ZOLT_BOOTSTRAP_INSTALLATION_ID: installation-smoke
      ZOLT_SEED_TENANT_ID: tenant-smoke
      ZOLT_SEED_PRODUCT_KEY: product-smoke
      ZOLT_SEED_INSTALLATION_KEY: installation-smoke
      ZOLT_SMOKE_TENANT_ID: tenant-smoke
      ZOLT_SMOKE_PRODUCT_ID: product-smoke
      ZOLT_SMOKE_INSTALLATION_ID: installation-smoke
      PRISMA_GENERATE_SKIP_AUTOINSTALL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test:db-isolation
      - run: pnpm dev:api > /tmp/zolt-api.log 2>&1 &
      - run: pnpm dev:gateway > /tmp/zolt-gateway.log 2>&1 &
      - run: pnpm dev:worker > /tmp/zolt-worker.log 2>&1 &
      - run: |
          for i in {1..30}; do
            curl -fsS http://localhost:4000/health/ready && break
            sleep 2
          done
      - run: |
          for i in {1..30}; do
            curl -fsS http://localhost:4001/health/ready && break
            sleep 2
          done
      - run: pnpm smoke:e2e

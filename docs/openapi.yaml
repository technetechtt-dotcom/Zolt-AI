openapi: 3.1.0
info:
  title: Zolt AI API
  version: 0.1.0
  description: Tenant-isolated, advisory-only industrial intelligence API. No plant-control operation exists.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /health/live:
    get: { security: [], responses: { "200": { description: Liveness } } }
  /health/ready:
    get:
      {
        security: [],
        responses:
          {
            "200": { description: Ready },
            "503": { description: Dependency unavailable },
          },
      }
  /v1/auth/login:
    post:
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Login" } },
            },
        }
      responses:
        {
          "200": { description: Session created },
          "401": { $ref: "#/components/responses/Error" },
          "423": { $ref: "#/components/responses/Error" },
        }
  /v1/auth/switch-tenant:
    post:
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [tenantId],
                      properties: { tenantId: { type: string } },
                    },
                },
            },
        }
      responses:
        {
          "200": { description: New tenant-bound session },
          "403": { $ref: "#/components/responses/Error" },
        }
  /v1/me:
    get: { responses: { "200": { description: Current principal } } }
  /v1/me/tenants:
    get:
      {
        responses:
          { "200": { description: User memberships and tenant roles } },
      }
  /v1/me/mfa/enrol:
    post:
      { responses: { "200": { description: TOTP enrolment secret and URI } } }
  /v1/me/mfa/confirm:
    post:
      { responses: { "200": { description: MFA enabled and recovery codes } } }
  /v1/me/sessions:
    get: { responses: { "200": { description: Session devices } } }
    delete: { responses: { "200": { description: All sessions revoked } } }
  /v1/telemetry:
    post:
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      oneOf:
                        [
                          { $ref: "#/components/schemas/TelemetryEnvelope" },
                          {
                            type: array,
                            maxItems: 100,
                            items:
                              {
                                $ref: "#/components/schemas/TelemetryEnvelope",
                              },
                          },
                        ],
                    },
                },
            },
        }
      responses:
        {
          "202": { description: Accepted },
          "400": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
        }
    get:
      parameters:
        - { in: query, name: tenantId, schema: { type: string } }
        - {
            in: query,
            name: productId,
            required: true,
            schema: { type: string },
          }
        - {
            in: query,
            name: installationId,
            required: true,
            schema: { type: string },
          }
      responses: { "200": { description: Tenant/access-filtered telemetry } }
  /v1/telemetry/stream:
    get:
      {
        responses:
          {
            "200":
              {
                description: Server-sent tenant/access-filtered telemetry stream,
                content: { text/event-stream: {} },
              },
          },
      }
  /v1/recommendations:
    get:
      {
        responses:
          { "200": { description: Tenant/access-filtered recommendations } },
      }
  /v1/recommendations/{id}/status:
    patch:
      parameters:
        [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        {
          "200": { description: Status transition recorded and audited },
          "403": { $ref: "#/components/responses/Error" },
        }
  /v1/credentials:
    get:
      {
        responses:
          { "200": { description: Credentials without secret material } },
      }
    post:
      {
        responses:
          {
            "200":
              {
                description: One-time plaintext; high-risk scope may require approval,
              },
          },
      }
  /v1/credentials/{id}/approve:
    post:
      parameters:
        [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { "200": { description: High-risk credential approved } }
  /v1/credentials/emergency-revoke:
    post: { responses: { "200": { description: Scoped emergency revocation } } }
  /v1/webhooks:
    get: { responses: { "200": { description: Tenant webhooks } } }
    post: { responses: { "200": { description: Validated webhook created } } }
  /v1/webhooks/{id}/test:
    post:
      parameters:
        [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { "200": { description: Test delivery queued } }
  /v1/queues/health:
    get:
      {
        responses:
          { "200": { description: Depth, state and oldest-message age } },
      }
  /v1/queues/dead-letter:
    get:
      { responses: { "200": { description: Dead-letter or quarantine jobs } } }
    delete: { responses: { "200": { description: Selected queue purged } } }
  /v1/copilot/ask:
    post:
      {
        responses:
          {
            "200":
              { description: Generated inference with tenant-bound citations },
          },
      }
  /v1/optimisation:
    post:
      { responses: { "200": { description: Advisory-only constrained plan } } }
  /v1/tenant/export:
    get:
      {
        responses:
          { "200": { description: Tenant data export without secrets } },
      }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    apiKeyAuth: { type: apiKey, in: header, name: x-zolt-api-key }
  responses:
    Error:
      description: Error
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  required: [code],
                  properties: { code: { type: string } },
                },
            },
        }
  schemas:
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        tenantId: { type: string }
        totpCode: { type: string, pattern: "^[0-9]{6}$" }
        recoveryCode: { type: string }
        deviceName: { type: string }
    TelemetryEnvelope:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          messageId,
          tenantId,
          productId,
          installationId,
          deviceId,
          sourceTimestamp,
          receivedTimestamp,
          measurements,
        ]
      properties:
        schemaVersion: { type: string, enum: ["1.0", "1.1"] }
        messageId: { type: string, minLength: 8, maxLength: 128 }
        tenantId: { type: string }
        productId: { type: string }
        installationId: { type: string }
        deviceId: { type: string }
        sourceTimestamp: { type: string, format: date-time }
        receivedTimestamp: { type: string, format: date-time }
        simulated: { type: boolean }
        measurements:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [key, value, quality]
            properties:
              key: { type: string }
              value: {}
              unit: { type: string }
              quality:
                {
                  type: string,
                  enum: [GOOD, UNCERTAIN, STALE, INVALID, ESTIMATED, MISSING],
                }

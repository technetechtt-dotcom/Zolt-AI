global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: "zolt-api"
    static_configs:
      - targets: ["host.docker.internal:4000"]
    metrics_path: /metrics

  - job_name: "zolt-gateway"
    static_configs:
      - targets: ["host.docker.internal:4001"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "zolt-api"
    static_configs:
      - targets: ["zolt-api:4000"]
    metrics_path: /metrics

  - job_name: "zolt-gateway"
    static_configs:
      - targets: ["zolt-gateway:4001"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]

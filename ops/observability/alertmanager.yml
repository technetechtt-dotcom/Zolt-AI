route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: p1-escalation
      continue: true

receivers:
  - name: default
    webhook_configs:
      - url: "http://alert-sink:9095/alerts"
        send_resolved: true
  - name: p1-escalation
    webhook_configs:
      - url: "http://alert-sink:9095/alerts"
        send_resolved: true

inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["alertname", "service"]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: zolt-host-api
          scrape_interval: 10s
          static_configs:
            - targets: ["host.docker.internal:4000"]
          metrics_path: /metrics
        - job_name: zolt-host-gateway
          scrape_interval: 10s
          static_configs:
            - targets: ["host.docker.internal:4001"]
          metrics_path: /metrics

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
